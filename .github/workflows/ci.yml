name: CI

# Every push and pull request is tested and the image is built for every
# platform. Images are published only from main (as :edge) and from version
# tags (as :1.2.3, :1.2, :1 and :latest), and a version tag also cuts a
# GitHub release with binaries.
on:
  push:
    branches: ["**"]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  # Superseded runs on branches and PRs are cancelled; main and tags always finish.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

env:
  TAILWIND_VERSION: v4.1.11
  ESBUILD_VERSION: 0.28.2

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      # esbuild strips the types at build time without checking them, so
      # tsc checks them here.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npx --yes -p typescript@5 tsc -p tsconfig.json
      - run: npx --yes -p typescript@5 tsc -p tsconfig.sw.json

  image:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      PUBLISH: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - if: env.PUBLISH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}},enable=${{ !startsWith(github.ref, 'refs/tags/v0.') }}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
            type=edge,branch=main
            type=sha,format=short,enable=${{ env.PUBLISH == 'true' }}
            type=ref,event=pr

      # The Dockerfile cross-compiles from the runner's own architecture, so
      # the arm images need no QEMU and build as fast as amd64.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ env.PUBLISH == 'true' }}
          build-args: RELEASE=${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('edge-{0}', github.sha) }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    needs: image
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build the stylesheet and scripts
        run: |
          bin="$RUNNER_TEMP/bin"; mkdir -p "$bin"
          curl -fsSLo "$bin/tailwindcss" \
            "https://github.com/tailwindlabs/tailwindcss/releases/download/${TAILWIND_VERSION}/tailwindcss-linux-x64"
          chmod +x "$bin/tailwindcss"
          curl -fsSL "https://registry.npmjs.org/@esbuild/linux-x64/-/linux-x64-${ESBUILD_VERSION}.tgz" | tar xz -C "$RUNNER_TEMP"
          make css js TAILWIND="$bin/tailwindcss" ESBUILD="$RUNNER_TEMP/package/bin/esbuild"

      - name: Cross-compile
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          for target in linux/amd64 linux/arm64 linux/arm/7 darwin/amd64 darwin/arm64 windows/amd64; do
            IFS=/ read -r os arch arm <<< "$target"
            name="signpost_${VERSION}_${os}_${arch}${arm:+v$arm}"
            exe=signpost; [ "$os" = windows ] && exe=signpost.exe
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch GOARM=$arm \
              go build -trimpath -ldflags="-s -w -X main.release=${VERSION}" -o "build/$name/$exe" .
            cp LICENSE README.md "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum * > checksums.txt)

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=; [[ "$GITHUB_REF_NAME" == *-* ]] && prerelease=--prerelease
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes $prerelease \
            --title "signpost $GITHUB_REF_NAME"
