<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>signpost</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><path d='M15 3h2v26h-2z' fill='%23888'/><path d='M6 7h17l4 4-4 4H6z' fill='%23f5a524'/><path d='M26 17H9l-4 4 4 4h17z' fill='%2338bdf8'/></svg>">
<style>
:root {
  --bg: #fbfaf7; --panel: #ffffff; --ink: #1c1b19; --mute: #6b6760; --line: #e6e2da;
  --accent: #c2410c; --accent-ink: #fff; --ok: #15803d; --warn: #b45309; --bad: #b91c1c; --code: #f3f0ea;
  --mono: ui-monospace, "JetBrains Mono", "SF Mono", Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #121110; --panel: #1b1a18; --ink: #ece8e1; --mute: #9b968d; --line: #2c2a27;
    --accent: #f59e0b; --accent-ink: #1a1305; --ok: #4ade80; --warn: #fbbf24; --bad: #f87171; --code: #24221f; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 system-ui, sans-serif; }
main { max-width: 1100px; margin: 0 auto; padding: 24px 16px 64px; }
header { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
h1 { font: 600 22px var(--mono); margin: 0; }
h1 span { color: var(--accent); }
header p { margin: 0; color: var(--mute); font-family: var(--mono); font-size: 12px; }
h2 { font: 600 13px var(--mono); text-transform: lowercase; color: var(--mute); margin: 28px 0 10px; }
h2::before { content: "$ "; color: var(--accent); }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
form.add { display: grid; grid-template-columns: 180px 1fr 2fr 90px auto; gap: 8px; padding: 12px; align-items: end; }
form.add .note { grid-column: 1 / -2; }
label { display: block; font: 11px var(--mono); color: var(--mute); margin-bottom: 3px; }
input, select { width: 100%; font: 13px var(--mono); color: var(--ink); background: var(--bg); border: 1px solid var(--line);
  border-radius: 6px; padding: 7px 9px; }
input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
button { font: 600 13px var(--mono); border: 1px solid var(--line); background: var(--panel); color: var(--ink);
  border-radius: 6px; padding: 7px 12px; cursor: pointer; white-space: nowrap; }
button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
button.ghost { border: none; background: none; color: var(--mute); padding: 4px 6px; }
button.ghost:hover { color: var(--ink); }
button.danger:hover { color: var(--bad); }
.msg { font: 12px var(--mono); padding: 0 12px 12px; min-height: 0; }
.msg.err { color: var(--bad); } .msg.ok { color: var(--ok); }
.toolbar { display: flex; gap: 8px; margin-bottom: 8px; }
.toolbar input { max-width: 320px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font: 11px var(--mono); color: var(--mute); font-weight: 500; padding: 9px 10px; border-bottom: 1px solid var(--line); }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: none; }
td.num { font-family: var(--mono); text-align: right; }
.link { font-family: var(--mono); font-weight: 600; cursor: copy; }
.link .host { color: var(--mute); font-weight: 400; }
.target { font-family: var(--mono); font-size: 12px; color: var(--mute); word-break: break-all; cursor: text; }
.target:hover { color: var(--ink); }
.note-txt { font-size: 12px; color: var(--mute); }
.badge { font: 11px var(--mono); padding: 1px 7px; border-radius: 99px; border: 1px solid currentColor; white-space: nowrap; }
.live { color: var(--ok); } .pending { color: var(--mute); } .dns { color: var(--warn); } .error { color: var(--bad); }
.actions { white-space: nowrap; text-align: right; }
.empty { padding: 28px; text-align: center; color: var(--mute); font-family: var(--mono); }
dialog { border: 1px solid var(--line); border-radius: 10px; background: var(--panel); color: var(--ink); width: min(640px, calc(100vw - 32px)); padding: 0; }
dialog::backdrop { background: rgb(0 0 0 / .4); }
dialog .head { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; border-bottom: 1px solid var(--line); font-family: var(--mono); }
dialog .body { padding: 12px 16px 16px; max-height: 70vh; overflow: auto; }
.bars { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 14px; }
.bar { display: flex; gap: 8px; font: 12px var(--mono); align-items: center; margin: 3px 0; }
.bar i { display: block; height: 8px; background: var(--accent); border-radius: 4px; min-width: 2px; }
.bar span:first-child { width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code { font: 12px var(--mono); background: var(--code); padding: 1px 5px; border-radius: 4px; }
.toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg);
  font: 12px var(--mono); padding: 7px 12px; border-radius: 6px; opacity: 0; transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
@media (max-width: 760px) {
  form.add { grid-template-columns: 1fr 1fr; }
  form.add .t, form.add .note { grid-column: 1 / -1; }
  .hide-sm { display: none; }
  .bars { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<main>
  <header>
    <h1>sign<span>post</span></h1>
    <p id="who">short links, straight into traefik</p>
  </header>

  <h2>new link</h2>
  <div class="card">
    <form class="add" id="add">
      <div><label for="host">host</label><input id="host" list="hosts" placeholder="milind.dev" required autocomplete="off"></div>
      <div><label for="path">path</label><input id="path" placeholder="/ade  or  /*" required autocomplete="off"></div>
      <div class="t"><label for="target">goes to</label><input id="target" type="url" placeholder="https://..." required></div>
      <div><label for="status">code</label>
        <select id="status"><option>302</option><option>301</option><option>307</option><option>308</option></select></div>
      <div><button class="primary" type="submit">add</button></div>
      <div class="note"><input id="note" placeholder="note (optional): giveaway reel, affiliate, etc"></div>
      <div><label style="display:flex;gap:6px;align-items:center;margin:0"><input type="checkbox" id="keepq" checked style="width:auto"> keep ?query</label></div>
    </form>
    <div class="msg" id="addmsg"></div>
  </div>
  <datalist id="hosts"></datalist>

  <h2>links</h2>
  <div class="toolbar"><input id="filter" placeholder="filter..." autocomplete="off"></div>
  <div class="card"><table>
    <thead><tr><th>link</th><th class="hide-sm">goes to</th><th style="text-align:right">clicks</th><th class="hide-sm">last</th><th>status</th><th></th></tr></thead>
    <tbody id="links"></tbody>
  </table></div>

  <h2>domains</h2>
  <div class="card"><table>
    <thead><tr><th>host</th><th style="text-align:right">links</th><th class="hide-sm">cert resolver</th><th>fallback for unknown paths</th><th></th></tr></thead>
    <tbody id="domains"></tbody>
  </table></div>
  <p class="note-txt" style="font-family:var(--mono)">a fallback hands signpost the <em>whole</em> host. only set one where nothing else lives, e.g. <span class="code">https://www.plusxhub.com/{path}</span>.</p>
</main>

<dialog id="dlg"><div class="head"><span id="dlgtitle"></span><button class="ghost" onclick="dlg.close()">close</button></div><div class="body" id="dlgbody"></div></dialog>
<div class="toast" id="toast"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let links = [], domains = [];

async function api(method, path, body) {
  const r = await fetch(path, { method, headers: body ? { "Content-Type": "application/json" } : {}, body: body ? JSON.stringify(body) : undefined });
  if (r.status === 204 || r.status === 202) return null;
  const j = await r.json().catch(() => ({}));
  if (!r.ok) { const e = new Error(j.error || r.statusText); e.status = r.status; throw e; }
  return j;
}
function toast(t) { const el = $("#toast"); el.textContent = t; el.classList.add("show"); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove("show"), 1600); }
function ago(ts) {
  if (!ts) return "never";
  const s = Date.now() / 1000 - ts;
  if (s < 60) return "just now";
  if (s < 3600) return Math.floor(s / 60) + "m ago";
  if (s < 86400) return Math.floor(s / 3600) + "h ago";
  return Math.floor(s / 86400) + "d ago";
}
const shown = (l) => l.path === "*" ? "/*" : l.path;

async function load() {
  [links, domains] = await Promise.all([api("GET", "/api/links"), api("GET", "/api/domains")]);
  render();
  if (links.some((l) => l.check === "pending")) setTimeout(load, 4000);
}

function render() {
  const f = $("#filter").value.toLowerCase();
  const rows = links.filter((l) => !f || (l.host + shown(l) + l.target + l.note).toLowerCase().includes(f));
  $("#links").innerHTML = rows.length ? rows.map((l) => `
    <tr>
      <td><div class="link" title="click to copy" data-copy="https://${esc(l.host)}${esc(l.path === "*" ? "/" : l.path)}"><span class="host">${esc(l.host)}</span>${esc(shown(l))}</div>
        ${l.note ? `<div class="note-txt">${esc(l.note)}</div>` : ""}</td>
      <td class="hide-sm"><div class="target" data-edit="${l.id}" title="click to change">${esc(l.target)}</div>
        <div class="note-txt">${l.status}${l.keep_query ? "" : " · drops query"}</div></td>
      <td class="num">${l.clicks}</td>
      <td class="hide-sm note-txt">${ago(l.last_click)}</td>
      <td><span class="badge ${esc(l.check)}" title="${esc(l.check_msg)}">${esc(l.check)}</span></td>
      <td class="actions">
        <button class="ghost" data-stats="${l.id}">stats</button>
        <button class="ghost" data-check="${l.id}">recheck</button>
        <button class="ghost danger" data-del="${l.id}">rm</button>
      </td>
    </tr>`).join("") : `<tr><td colspan="6" class="empty">${links.length ? "nothing matches" : "no links yet. make one up there."}</td></tr>`;

  $("#hosts").innerHTML = domains.map((d) => `<option value="${esc(d.host)}">`).join("");
  $("#domains").innerHTML = domains.length ? domains.map((d) => `
    <tr>
      <td class="link">${esc(d.host)}</td>
      <td class="num">${d.links}</td>
      <td class="hide-sm"><input value="${esc(d.cert_resolver)}" data-res="${esc(d.host)}" style="max-width:180px"></td>
      <td><input value="${esc(d.fallback)}" placeholder="none: other paths stay with the site" data-fb="${esc(d.host)}"></td>
      <td class="actions"><button class="ghost" data-save="${esc(d.host)}">save</button>${d.links ? "" : `<button class="ghost danger" data-dropdomain="${esc(d.host)}">rm</button>`}</td>
    </tr>`).join("") : `<tr><td colspan="5" class="empty">domains show up here once they have a link</td></tr>`;
}

$("#filter").addEventListener("input", render);

$("#add").addEventListener("submit", async (e) => {
  e.preventDefault();
  const body = { host: $("#host").value.trim(), path: $("#path").value.trim(), target: $("#target").value.trim(),
    status: +$("#status").value, keep_query: $("#keepq").checked, note: $("#note").value.trim() };
  const msg = $("#addmsg");
  msg.className = "msg"; msg.textContent = "checking nothing already lives there...";
  try {
    await api("POST", "/api/links", body);
  } catch (err) {
    if (err.status === 409 && !/already exists/.test(err.message) && confirm(err.message.replace(/ \(pass force.*\)/, "") + "\n\nTake it anyway?")) {
      try { await api("POST", "/api/links", { ...body, force: true }); }
      catch (e2) { msg.className = "msg err"; msg.textContent = e2.message; return; }
    } else { msg.className = "msg err"; msg.textContent = err.message.replace(/ \(pass force.*\)/, ""); return; }
  }
  msg.className = "msg ok"; msg.textContent = `added. traefik picks it up in a few seconds; status flips to live once it answers.`;
  $("#path").value = ""; $("#target").value = ""; $("#note").value = "";
  load();
});

document.addEventListener("click", async (e) => {
  const t = e.target.closest("[data-copy],[data-edit],[data-del],[data-check],[data-stats],[data-save],[data-dropdomain]");
  if (!t) return;
  const d = t.dataset;
  try {
    if (d.copy) { await navigator.clipboard.writeText(d.copy); toast("copied " + d.copy); }
    if (d.edit) {
      const l = links.find((x) => x.id == d.edit);
      const nt = prompt("New target for " + l.host + shown(l), l.target);
      if (nt && nt !== l.target) { await api("PATCH", "/api/links/" + l.id, { target: nt }); toast("updated"); load(); }
    }
    if (d.del) {
      const l = links.find((x) => x.id == d.del);
      if (confirm(`Remove ${l.host}${shown(l)}? Its clicks go with it.`)) { await api("DELETE", "/api/links/" + l.id); toast("removed"); load(); }
    }
    if (d.check) { await api("POST", `/api/links/${d.check}/check`); load(); }
    if (d.stats) stats(links.find((x) => x.id == d.stats));
    if (d.save) {
      const host = d.save;
      await api("PUT", "/api/domains/" + host, { cert_resolver: $(`[data-res="${host}"]`).value.trim(), fallback: $(`[data-fb="${host}"]`).value.trim() });
      toast("saved " + host); load();
    }
    if (d.dropdomain && confirm("Forget " + d.dropdomain + "?")) { await api("DELETE", "/api/domains/" + d.dropdomain); load(); }
  } catch (err) { alert(err.message); }
});

function tally(arr, key) {
  const m = {};
  for (const c of arr) { let k = c[key] || "(none)"; if (key === "referrer") { try { k = new URL(k).host; } catch {} } m[k] = (m[k] || 0) + 1; }
  return Object.entries(m).sort((a, b) => b[1] - a[1]).slice(0, 8);
}
function bars(title, rows) {
  const max = Math.max(1, ...rows.map((r) => r[1]));
  return `<div><label>${title}</label>${rows.map(([k, v]) => `<div class="bar"><span title="${esc(k)}">${esc(k)}</span><i style="width:${(v / max) * 120}px"></i><span>${v}</span></div>`).join("") || '<div class="note-txt">nothing yet</div>'}</div>`;
}
async function stats(l) {
  $("#dlgtitle").textContent = l.host + shown(l) + "  ·  " + l.clicks + " clicks";
  $("#dlgbody").innerHTML = "loading...";
  dlg.showModal();
  const cs = await api("GET", `/api/links/${l.id}/clicks`);
  $("#dlgbody").innerHTML = `<div class="bars">${bars("referrers", tally(cs, "referrer"))}${bars("countries", tally(cs, "country"))}</div>
    <label>latest</label><table>${cs.slice(0, 50).map((c) => `<tr><td class="note-txt">${new Date(c.at * 1000).toLocaleString()}</td><td class="note-txt">${esc(c.country)}</td><td class="target">${esc(c.referrer || "direct")}</td></tr>`).join("") || '<tr><td class="empty">no clicks yet</td></tr>'}</table>`;
}

api("GET", "/api/whoami").then((w) => { if (w.user) $("#who").textContent = "hi " + w.user + " · short links, straight into traefik"; }).catch(() => {});
load().catch((e) => { $("#links").innerHTML = `<tr><td colspan="6" class="empty">${esc(e.message)}</td></tr>`; });
</script>
</body>
</html>
